<!-- Source for the raster icons. Regenerate with: node scripts/make-icons.mjs
     Palette follows epicbet's own: #111627 background, #141F34 surface,
     #B6EA00 accent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#2A3352"/>
      <stop offset="100%" stop-color="#111627"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFE81A"/>
      <stop offset="55%" stop-color="#DCF000"/>
      <stop offset="100%" stop-color="#B6EA00"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#bg)"/>

  <!-- rising stat bars -->
  <g fill="#B6EA00" opacity="0.45">
    <rect x="20" y="82" width="19" height="28" rx="6"/>
    <rect x="48" y="66" width="19" height="44" rx="6"/>
    <rect x="76" y="46" width="19" height="64" rx="6"/>
  </g>

  <!-- bolt, outlined in the background colour so it reads over the bars -->
  <path d="M80 12 L36 70 h23 L48 118 l44-60 H70 z"
        fill="url(#bolt)" stroke="#111627" stroke-width="7" stroke-linejoin="round"/>

  <!-- live dot -->
  <circle cx="103" cy="25" r="11" fill="#111627"/>
  <circle cx="103" cy="25" r="7" fill="#FF4438"/>
</svg>
